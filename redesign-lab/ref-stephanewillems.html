<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ref: stephanewillems.be/skills — draw-in icons + toggle</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== stephanewillems.be/skills recreation in its OWN palette =====
   Navy gradient, cursive logo, centered pill nav, Technology<->Personal toggle,
   skill icons as thin outline strokes that DRAW IN (pathLength-normalized) + hover glow. */
:root{--navy:#141d33;--navy2:#0e1426;--text:#eef1f8;--muted:#9aa4bd;--line:#cdd8f0;--accent:#FFDF00}
@layer reset, tokens, prose, components, overrides;
/* This page does not load foundations.css, so it keeps its own reset - but LAYERED.
   Unlayered, it outranks every layer and wipes the padding of every component here. */
@layer reset{*{box-sizing:border-box;margin:0;padding:0}}
body{font-family:"Inter",system-ui,sans-serif;color:var(--text);min-height:100vh;
  background:radial-gradient(120% 80% at 50% 0%,#1d2a4d,#141d33 45%,#0c1222 100%)}
header{display:flex;align-items:center;justify-content:space-between;padding:1.4rem 2rem;position:relative}
.logo{font-family:"Sacramento",cursive;font-size:1.8rem;color:#dfe6f7;
  clip-path:inset(0 100% 0 0);animation:write 1.9s cubic-bezier(.65,0,.25,1) .15s forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:.3rem;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:.35rem}
.nav a{color:var(--muted);text-decoration:none;font-size:.85rem;padding:.45rem 1.1rem;border-radius:999px}
.nav a.on{color:#fff;border:1px solid rgba(255,255,255,.5)}
@media(max-width:680px){.nav{display:none}}

.toggle{display:flex;align-items:center;justify-content:center;gap:.9rem;margin:2.5rem 0 1rem;font-size:.95rem;color:var(--muted)}
.toggle .lbl.act{color:#fff}
.sw{appearance:none;width:46px;height:24px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;outline:none;border:1px solid rgba(255,255,255,.2)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .25s}
.sw:checked::after{left:24px}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.6rem 1rem;max-width:760px;margin:1rem auto 5rem;padding:0 1.5rem}
@media(max-width:680px){.grid{grid-template-columns:repeat(3,1fr)}}
.personal-group{display:none}
body.personal .tech-group{display:none}
body.personal .personal-group{display:grid}

.skill{display:flex;flex-direction:column;align-items:center;gap:.5rem;--d:0s}
.skill .label{font-size:.72rem;color:var(--muted);opacity:0;animation:fadein .6s ease forwards;animation-delay:calc(var(--d) + .8s)}
@keyframes fadein{to{opacity:1}}
.icon{width:62px;height:62px;overflow:visible;filter:drop-shadow(rgba(255,223,0,0) 2px 2px 10px);transition:transform .3s ease,filter .3s ease}
.icon [pathLength]{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s ease forwards;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
.icon [pathLength],.icon path,.icon line,.icon polyline,.icon polygon,.icon circle,.icon rect,.icon ellipse{transition:stroke .25s ease,fill .25s ease}
.skill:hover .icon{transform:scale(1.08);filter:drop-shadow(rgba(255,223,0,.9) 2px 2px 10px)}
.skill:hover .icon [pathLength],.skill:hover .icon path,.skill:hover .icon line,.skill:hover .icon polyline,.skill:hover .icon polygon,.skill:hover .icon circle,.skill:hover .icon rect,.skill:hover .icon ellipse{stroke:var(--accent)}
.labtag{position:fixed;left:14px;bottom:14px;font-size:10px;color:rgba(238,241,248,.5)}
.labtag a{color:#9ab6ff}
@media (prefers-reduced-motion:reduce){.icon [pathLength]{animation:none;stroke-dashoffset:0}.skill .label{animation:none;opacity:1}}
</style>
</head>
<body>
<header>
  <div class="logo">St&eacute;phane Willems</div>
  <nav class="nav"><a href="#">Home</a><a class="on" href="#">Skills</a><a href="#">Projects</a><a href="#">About</a><a href="#">Hire me</a></nav>
  <div style="width:40px"></div>
</header>

<div class="toggle"><span class="lbl act" id="lblT">Technology</span><input type="checkbox" class="sw" id="sw"><span class="lbl" id="lblP">Personal Skills</span></div>

<div class="grid tech-group" id="tech">
  <div class="skill" style="--d:0s"><svg class="icon" viewBox="0 0 64 64"><rect pathLength="1" x="10" y="10" width="44" height="44" rx="8"/><path pathLength="1" d="M30 28v12a4 4 0 0 1-8 0M44 28a5 5 0 0 0-8 4c0 6 8 4 8 8a5 5 0 0 1-8 0"/></svg><span class="label">JavaScript</span></div>
  <div class="skill" style="--d:.1s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M16 10h32l-3 36-13 6-13-6z"/><path pathLength="1" d="M24 24h16l-1 14-7 3-7-3"/></svg><span class="label">HTML5</span></div>
  <div class="skill" style="--d:.2s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M16 10h32l-3 36-13 6-13-6z"/><path pathLength="1" d="M40 22H24l1 10h14l-1 8-6 2-6-2"/></svg><span class="label">CSS3</span></div>
  <div class="skill" style="--d:.3s"><svg class="icon" viewBox="0 0 64 64"><circle pathLength="1" cx="32" cy="32" r="5"/><ellipse pathLength="1" cx="32" cy="32" rx="22" ry="9"/><ellipse pathLength="1" cx="32" cy="32" rx="22" ry="9" transform="rotate(60 32 32)"/><ellipse pathLength="1" cx="32" cy="32" rx="22" ry="9" transform="rotate(120 32 32)"/></svg><span class="label">React</span></div>
  <div class="skill" style="--d:.4s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M32 8l22 12v24L32 56 10 44V20z"/></svg><span class="label">Node</span></div>
  <div class="skill" style="--d:.5s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M12 16h10l10 18 10-18h10L32 52z"/></svg><span class="label">Vue</span></div>
  <div class="skill" style="--d:.6s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M10 40c8-22 36-22 44 0-8 8-14-2-22-2s-14 10-22 2z"/></svg><span class="label">Tailwind</span></div>
  <div class="skill" style="--d:.7s"><svg class="icon" viewBox="0 0 64 64"><circle pathLength="1" cx="18" cy="20" r="5"/><circle pathLength="1" cx="18" cy="46" r="5"/><circle pathLength="1" cx="44" cy="33" r="5"/><path pathLength="1" d="M18 25v16M22 44l18-9"/></svg><span class="label">Git</span></div>
  <div class="skill" style="--d:.8s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M32 8C20 20 22 30 32 38c10-8 12-18 0-30z"/><path pathLength="1" d="M24 40c0 8 4 12 8 16 4-4 8-8 8-16"/></svg><span class="label">MongoDB</span></div>
  <div class="skill" style="--d:.9s"><svg class="icon" viewBox="0 0 64 64"><ellipse pathLength="1" cx="32" cy="32" rx="16" ry="22"/><path pathLength="1" d="M22 18c2 10 2 22 8 30M40 20c-2 8-2 18 2 24"/></svg><span class="label">PostgreSQL</span></div>
  <div class="skill" style="--d:1s"><svg class="icon" viewBox="0 0 64 64"><rect pathLength="1" x="10" y="22" width="44" height="20" rx="10"/><path pathLength="1" d="M22 28v8M30 28v8M30 32h4a2 2 0 0 0 0-4h-4M40 36l4-8 4 8"/></svg><span class="label">PHP</span></div>
  <div class="skill" style="--d:1.1s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M12 18h40v8H12zM12 30h40v8H12zM12 42h40v8H12z"/></svg><span class="label">Laravel</span></div>
</div>

<div class="grid personal-group" id="personal">
  <div class="skill" style="--d:0s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M12 16h40v26H30l-12 10v-10h-6z"/></svg><span class="label">Communication</span></div>
  <div class="skill" style="--d:.12s"><svg class="icon" viewBox="0 0 64 64"><circle pathLength="1" cx="22" cy="22" r="8"/><circle pathLength="1" cx="42" cy="22" r="8"/><path pathLength="1" d="M10 50c2-10 10-14 12-14M52 50c-2-10-10-14-12-14"/></svg><span class="label">Teamwork</span></div>
  <div class="skill" style="--d:.24s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M32 10a14 14 0 0 1 8 26v6H24v-6a14 14 0 0 1 8-26z"/><path pathLength="1" d="M26 50h12M28 54h8"/></svg><span class="label">Problem Solving</span></div>
  <div class="skill" style="--d:.36s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M32 8l7 16 17 1-13 11 5 17-16-10-16 10 5-17-13-11 17-1z"/></svg><span class="label">Creativity</span></div>
  <div class="skill" style="--d:.48s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M14 24a18 18 0 0 1 34-4M50 40a18 18 0 0 1-34 4"/><path pathLength="1" d="M48 12v8h-8M16 52v-8h8"/></svg><span class="label">Adaptability</span></div>
  <div class="skill" style="--d:.6s"><svg class="icon" viewBox="0 0 64 64"><path pathLength="1" d="M18 54V12l24 6-24 6"/></svg><span class="label">Leadership</span></div>
</div>

<div class="labtag"><a href="/redesign-lab/">&larr; lab index</a> &middot; ref: stephanewillems/skills</div>
<script>
(function(){
  var sw=document.getElementById('sw');
  function redraw(id){var g=document.getElementById(id);
    g.querySelectorAll('.icon [pathLength], .label').forEach(function(el){el.style.animation='none';void el.getBoundingClientRect();el.style.animation='';});}
  sw.addEventListener('change',function(){
    document.body.classList.toggle('personal',sw.checked);
    document.getElementById('lblT').classList.toggle('act',!sw.checked);
    document.getElementById('lblP').classList.toggle('act',sw.checked);
    redraw(sw.checked?'personal':'tech');
  });
  if(/hover/.test(location.search)){ /* dev: force the hover look on the first row for headless capture */
    [].slice.call(document.querySelectorAll('#tech .skill')).slice(0,6).forEach(function(s){
      var ic=s.querySelector('.icon'); ic.style.transform='scale(1.08)';
      ic.style.filter='drop-shadow(rgba(255,223,0,.9) 2px 2px 10px)';
      [].forEach.call(ic.querySelectorAll('path,line,polyline,polygon,circle,rect,ellipse'),function(p){p.style.stroke='#FFDF00';});
    });
  }
})();
</script>
</body>
</html>
