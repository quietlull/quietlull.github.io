<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />   <!-- dev: always serve fresh so reloads pick up edits -->
<title>Water rework — noise A/B + (ripples next) [Bob]</title>
<!--
  [Bob] Water agent's ISOLATED harness. Loads Rod's REAL dock scene (lanterns + dock + water + embers) so the water
  has something to reflect, then swaps the water material for mirroredSurface-bob.js (the noise-rework copy).
  Scope: water only. No character (that's Hana). v1 = scaffold + 4-sample noise A/B toggle. Ripples = next.
  Verify mechanically via window.__w (rAF is paused in the headless preview tab). Rod makes the visual call.
-->
<style>
  html, body { margin: 0; height: 100%; background: #080f1b; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 0; bottom: 0; padding: 8px 12px; font: 11px ui-monospace, monospace; color: #aeb6c8; pointer-events: none; }
  .tp-dfwv { max-height: calc(100vh - 16px); overflow-y: auto; overflow-x: hidden; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">[Bob] water rework — orbit to the water; click it to ripple. Tune in the panel.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Pane } from 'tweakpane';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
// Rod's REAL dock-scene modules (faithful copies in ./scene/). Water uses Bob's rework copy.
import { CONFIG, loadLanternsFBX, loadDockFBX } from './scene/three-shared.js';
import { LanternController } from './scene/lantern-controller.js';
import { LanternMaterialManager } from './scene/shader/lanternShaderManager.js';
import { MirroredSurface } from './scene/shader/mirroredSurface-bob.js';

// ---------- scene (same framing as the site dock scene) ----------
const cnvs = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080f1b);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 10000);
cam.position.set(0, 120, 500);
const re = new THREE.WebGLRenderer({ canvas: cnvs, antialias: true });
re.setPixelRatio(Math.min(devicePixelRatio, 1.5));
re.setSize(innerWidth, innerHeight, false);
re.outputColorSpace = THREE.SRGBColorSpace;
const orbCtrls = new OrbitControls(cam, cnvs);
orbCtrls.target.set(0, 60, 0); orbCtrls.enableDamping = true;   // aimed a bit lower than the char scene to keep water in frame

const composer = new EffectComposer(re);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),
  0.25, CONFIG.lanterns.bloom.radius, CONFIG.lanterns.bloom.threshold);
composer.addPass(bloom); composer.addPass(new OutputPass());

// ---------- Rod's real dock scene (copied modules) ----------
const lanternController = new LanternController(CONFIG, cam, { displacementScale: 3, intersectionZ: -150 });
const lanternMaterialManager = new LanternMaterialManager(CONFIG);
const fbxLoader = new FBXLoader();
loadLanternsFBX(fbxLoader, scene, lanternController, lanternMaterialManager);
loadDockFBX(fbxLoader, scene);

let mirroredSurface = null, pane = null, waterFbx = null;
fbxLoader.load('/assets/mesh/lantern-night/Water.fbx', (fbx) => {
  let waterMesh = null; fbx.traverse(c => { if (c.isMesh) waterMesh = c; });
  if (!waterMesh) { document.getElementById('hud').textContent = '[Bob] Water.fbx had no mesh'; return; }
  scene.add(fbx);
  waterFbx = fbx;   // ref for the "solo water" toggle (hide everything else to isolate the surface)
  mirroredSurface = new MirroredSurface(scene, cam, re, waterMesh, {
    reflectionIntensity: CONFIG.water.reflection.reflectionIntensity,
    reflectionTint: new THREE.Color(CONFIG.water.reflection.reflectionTint),
    waveStrength: CONFIG.water.waves.waveStrength, waveSpeed: 1.5,
    waveScale: CONFIG.water.waves.waveScale, waveType: CONFIG.water.waves.waveType,
    noiseMode: 1,   // [Bob] default = the new 4-sample average
  });
  waterMesh.material = mirroredSurface.material;
  buildGUI();
  window.__w = { mirror: mirroredSurface, material: mirroredSurface.material, scene, cam, composer, renderer: re,
                 setNoiseMode: (m) => mirroredSurface.setNoiseMode(m),
                 spawnRipple: (p) => mirroredSurface.spawnRipple(p),
                 getActiveRipple: () => mirroredSurface.getActiveRipple() };
}, undefined, () => { document.getElementById('hud').textContent = '[Bob] Water.fbx load failed'; });

// Embers — faithful copy of Rod's About-scene fireflies (provenance: his code). Reflection content + life.
const EMBER_COUNT = 25;
const emberGeometry = new THREE.SphereGeometry(5, 8, 6);
emberGeometry.computeBoundingBox();
for (let i = 0; i < EMBER_COUNT; i++) {
  const mesh = new THREE.Mesh(emberGeometry);
  mesh.material = lanternMaterialManager.createMaterialForMesh(mesh, {
    baseColor: new THREE.Color(0xfff4cc), gradientStart: 1.0, gradientEnd: 0.35,
    flickerSpeed: (2.0 + Math.random() * 4.0), flickerAmount: (0.5 + Math.random() * 0.4),
    flickerColorShift: 0.2 + Math.random() * 0.15,
  });
  const side = Math.random() > 0.5 ? 1 : -1;
  mesh.position.set(side * (300 + Math.random() * 500), -50 + Math.random() * 450, -50 - Math.random() * 350);
  mesh.userData.floatScale = 1.0 + Math.random() * 0.5;
  mesh.userData.isEmber = true;
  lanternController.addLantern(mesh);
  scene.add(mesh);
}

// Click/tap a point on the water -> spawn a ripple there (raycast the water plane; lantern-controller pattern).
const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(), _hit = new THREE.Vector3();
let _wPlane = null, _dx = 0, _dy = 0, _dt = 0;
addEventListener('pointerdown', e => { _dx = e.clientX; _dy = e.clientY; _dt = performance.now(); });
addEventListener('pointerup', e => {
  if (!mirroredSurface) return;
  if (Math.hypot(e.clientX - _dx, e.clientY - _dy) > 6 || performance.now() - _dt > 500) return;   // drag, not a click
  _ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  _ray.setFromCamera(_ndc, cam);
  if (!_wPlane) _wPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -mirroredSurface.mirrorPlaneY);
  if (_ray.ray.intersectPlane(_wPlane, _hit)) mirroredSurface.spawnRipple(_hit);
});

function buildGUI() {
  if (pane) pane.dispose();
  pane = new Pane();
  const U = mirroredSurface.material.uniforms;
  const sel = { version: 'combined', fourSample: mirroredSurface.noiseMode === 1 };
  const v = pane.addFolder({ title: 'Version', expanded: true });
  v.addBinding(sel, 'version', { label: 'Water version', options: {
      'Original (Rod)': 'original', '1 - Normal distortion': 'normal', '2 - Fresnel depth': 'fresnel',
      '3 - Directional light': 'sun', 'Combined (keepers)': 'combined' } })
    .on('change', e => { mirroredSurface.applyVersion(e.value); pane.refresh(); });
  v.addBinding(sel, 'fourSample', { label: 'Noise: 4-sample (off = single)' })
    .on('change', e => mirroredSurface.setNoiseMode(e.value ? 1 : 0));

  const wf = pane.addFolder({ title: 'Wave field', expanded: true });
  const ns = { proc: U.uProcNoise.value > 0.5, worldSpace: U.uNoiseSpace.value > 0.5 };
  wf.addBinding(ns, 'proc', { label: 'Procedural noise (off = texture)' })
    .on('change', e => U.uProcNoise.value = e.value ? 1 : 0);
  wf.addBinding(ns, 'worldSpace', { label: 'Texture space: world (off = UV)' })
    .on('change', e => U.uNoiseSpace.value = e.value ? 1 : 0);
  wf.addBinding(U.uWorldScale, 'value', { min: 0.00005, max: 0.05, step: 0.00005, label: 'World scale (lower = bigger waves)' });
  wf.addBinding(U.uWaveSpeed, 'value', { min: 0, max: 3, step: 0.01, label: 'Speed' });
  wf.addBinding(U.uWaveScale, 'value', { min: 0.1, max: 4, step: 0.01, label: 'UV scale (orig)' });
  wf.addBinding(U.uWaveStrength, 'value', { min: 0, max: 0.2, step: 0.001, label: 'Original strength' });

  const d = pane.addFolder({ title: 'Reflection distort (warps the mirror; high = garbles)', expanded: true });
  d.addBinding(U.uDistort, 'value', { min: 0, max: 100, step: 0.01, label: 'Strength' });
  d.addBinding(U.uDistortFalloff, 'value', { min: 50, max: 1200, step: 10, label: 'Near falloff' });

  const sd = pane.addFolder({ title: 'Surface distort (shading only - non-destructive)', expanded: true });
  sd.addBinding(U.uNormalUp, 'value', { min: 0.02, max: 2, step: 0.01, label: 'Surface tilt (lower = wavier)' });
  sd.addBinding(U.uRidge, 'value', { min: 0, max: 1, step: 0.01, label: 'Ridge / crest sharpness' });


  const fr = pane.addFolder({ title: '2 - Fresnel depth', expanded: false });
  fr.addBinding(U.uFresnel, 'value', { min: 0, max: 1, step: 0.01, label: 'Depth' });
  fr.addBinding(U.uFresnelPow, 'value', { min: 1, max: 8, step: 0.1, label: 'Falloff pow' });
  fr.addBinding(U.uWaterColor, 'value', { color: { type: 'float' }, label: 'Water color' });

  const su = pane.addFolder({ title: '3 - Directional light', expanded: false });
  su.addBinding(U.uSunDiffuse, 'value', { min: 0, max: 2, step: 0.01, label: 'Strength (darkens troughs)' });
  su.addBinding(U.uSunLift, 'value', { min: 0, max: 1, step: 0.01, label: 'Crest lift (0 = pure dark)' });
  su.addBinding(U.uSunDir2, 'value', { label: 'Sun direction', x: { min: -1, max: 1 }, y: { min: 0, max: 1 }, z: { min: -1, max: 1 } });
  su.addBinding(U.uSunColor2, 'value', { color: { type: 'float' }, label: 'Sun color' });

  const rp = pane.addFolder({ title: 'Ripples (click the water)', expanded: true });
  rp.addButton({ title: 'Test ripple at center' })
    .on('click', () => mirroredSurface.spawnRipple(new THREE.Vector3(0, mirroredSurface.mirrorPlaneY, 0)));
  rp.addBinding(U.uRippleSpeed, 'value', { min: 5, max: 300, step: 1, label: 'Speed (expand)' });
  rp.addBinding(U.uRippleFreq, 'value', { min: 0.02, max: 1, step: 0.01, label: 'Frequency' });
  rp.addBinding(U.uRippleWidth, 'value', { min: 5, max: 120, step: 1, label: 'Ring width' });
  rp.addBinding(U.uRippleDecay, 'value', { min: 0.1, max: 3, step: 0.05, label: 'Decay' });
  rp.addBinding(U.uRippleLife, 'value', { min: 0.5, max: 10, step: 0.1, label: 'Lifetime' });
  rp.addBinding(U.uRippleAmp, 'value', { min: 0, max: 0.15, step: 0.001, label: 'Amplitude (reflection)' });
  rp.addBinding(U.uRippleSlope, 'value', { min: 0, max: 6, step: 0.05, label: 'Shading slope (fresnel/light)' });

  const scF = pane.addFolder({ title: 'Scene', expanded: true });
  const solo = { water: false };
  scF.addBinding(solo, 'water', { label: 'Solo water (hide scene)' }).on('change', e => {
    scene.children.forEach(c => { if (c !== waterFbx) c.visible = !e.value; });   // hide all but the water -> reflects only the bg
  });
  scF.addBinding(bloom, 'strength', { min: 0, max: 3, step: 0.05, label: 'Bloom' });
  scF.addBinding(bloom, 'radius', { min: 0, max: 2, step: 0.01, label: 'Bloom radius' });
  scF.addBinding(bloom, 'threshold', { min: 0, max: 1, step: 0.01, label: 'Bloom threshold' });
}

function resize() {
  if (cnvs.width !== innerWidth || cnvs.height !== innerHeight) {
    re.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight);
    cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
    if (mirroredSurface) mirroredSurface.handleResize();
  }
}
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const nd = dt * 60;   // normalized delta (frames) — what Rod's controllers expect
  orbCtrls.update();
  lanternMaterialManager.update(nd);
  lanternController.update(nd);
  if (mirroredSurface) mirroredSurface.update(nd);
  resize();
  composer.render();
}
animate();
</script>
</body>
</html>
