<!-- favicon: top-left anchor of the top bar. The icon is magnetic but CLAMPED to its box
     (data-magnet-clamp) and SPINS on hover; the link navigates home. (Rod 2026-06-14 — bring the
     site favicon back.) Magnet (translate) on .favicon__magnet, spin (rotate) on .favicon__img =
     different elements, so the transforms don't fight. overflow:hidden enforces "can't escape". -->
<div class="favicon-demo">
  <a class="favicon" data-tune="favicon" href="#" aria-label="Home">
    <span class="favicon__magnet js-magnetic" data-strength="50" data-magnet-clamp="6">
      <img class="favicon__img" src="/assets/img/favicons/favicon.svg" alt="" width="26" height="26" />
    </span>
  </a>
  <!-- SQUARE variant (Rod 2026-08-11 shape pass) -->
  <a class="favicon favicon--square" data-tune="favicon square" href="#" aria-label="Home (square variant)">
    <span class="favicon__magnet js-magnetic" data-strength="50" data-magnet-clamp="6">
      <img class="favicon__img" src="/assets/img/favicons/favicon.svg" alt="" width="26" height="26" />
    </span>
  </a>
</div>
