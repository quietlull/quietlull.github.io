<!-- magnetic behavior demo: bare pills so the PULL is judged in isolation (shapes live in button-kit) -->
<div class="magnetic-demo" data-tune="magnetic targets">
  <button class="magnetic-demo__target js-magnetic" data-strength="40" data-strength-text="20" type="button">
    <span class="js-magnetic-inner">strength 40</span>
  </button>
  <button class="magnetic-demo__target js-magnetic" data-strength="70" data-strength-text="35" type="button">
    <span class="js-magnetic-inner">strength 70</span>
  </button>
  <button class="magnetic-demo__target js-magnetic" data-strength="24" data-strength-text="12" type="button">
    <span class="js-magnetic-inner">strength 24</span>
  </button>
  <p class="magnetic-demo__hint">move the cursor across a pill — it follows, inner text lags (parallax)</p>
</div>
