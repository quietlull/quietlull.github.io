<!-- slap toggle: Technology <-> Personal (tools slot) — hana slap recolored to harumaki orange -->
<div class="slap-toggle-demo" data-tune="toggle row">
  <span class="slap-toggle js-magnetic" data-strength="40">
    <span class="slap-toggle__control">
      <input class="slap-toggle__radio" type="radio" name="slap-demo" id="slap-demo-a" value="a" checked />
      <label class="slap-toggle__label" for="slap-demo-a">Technology</label>
      <input class="slap-toggle__radio" type="radio" name="slap-demo" id="slap-demo-b" value="b" />
      <label class="slap-toggle__label" for="slap-demo-b">Personal</label>
      <span class="slap-toggle__flap" aria-hidden="true"><span class="slap-toggle__flap-text">Technology</span></span>
    </span>
  </span>
  <!-- SQUARE variant (Rod 2026-08-11 shape pass) -->
  <span class="slap-toggle slap-toggle--square js-magnetic" data-strength="40">
    <span class="slap-toggle__control">
      <input class="slap-toggle__radio" type="radio" name="slap-demo-sq" id="slap-demo-sq-a" value="a" checked />
      <label class="slap-toggle__label" for="slap-demo-sq-a">Technology</label>
      <input class="slap-toggle__radio" type="radio" name="slap-demo-sq" id="slap-demo-sq-b" value="b" />
      <label class="slap-toggle__label" for="slap-demo-sq-b">Personal</label>
      <span class="slap-toggle__flap" aria-hidden="true"><span class="slap-toggle__flap-text">Technology</span></span>
    </span>
  </span>
</div>
