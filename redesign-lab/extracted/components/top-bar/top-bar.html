<!-- top bar (restructured 2026-06-14, Rod): favicon + name LEFT, nav CENTERED, slap toggles RIGHT.
     Nav = transparent pill, lit only on active/hover. Favicon = clamped magnet + spin (favicon component).
     PROVENANCE: norikura shell; nav pill "lit like the view-project button" (button-kit primary); slap
     toggles = YarivFrd (flap-tracks-active-label scaling fix); favicon component. -->
<header class="top-bar" data-tune="top bar">
  <div class="top-bar__left">
    <a class="favicon favicon--square" data-tune="favicon" href="#" aria-label="Home">
      <span class="favicon__magnet js-magnetic" data-strength="50" data-magnet-clamp="6">
        <img class="favicon__img" src="/assets/img/favicons/favicon.svg" alt="" width="24" height="24" />
      </span>
    </a>
    <span class="top-bar__logo">RODNEY FAN</span>
  </div>

  <nav class="top-bar__nav" data-tune="nav links" data-bloom data-tspeed>
    <a class="top-bar__link is-active js-magnetic" data-strength="40" href="#">Home</a>
    <a class="top-bar__link js-magnetic" data-strength="40" href="#">Projects</a>
    <a class="top-bar__link js-magnetic" data-strength="40" href="#">About</a>
    <a class="top-bar__link js-magnetic" data-strength="40" href="#">Ramblings</a>
  </nav>

  <!-- bar toggles = SMALL SQUARE slap toggles (Rod 2026-08-11: slap here, goo moved to the hero).
       The bar's ghost-at-rest slap skin (below in top-bar.css) applies. Presentational on lab pages. -->
  <span class="top-bar__toggles" data-tune="bar toggles">
    <span class="slap-toggle slap-toggle--small slap-toggle--square js-magnetic" data-strength="25">
      <span class="slap-toggle__control">
        <input class="slap-toggle__radio" type="radio" name="bar-breathe" id="bar-breathe-on" checked />
        <label class="slap-toggle__label" for="bar-breathe-on">Breathing</label>
        <input class="slap-toggle__radio" type="radio" name="bar-breathe" id="bar-breathe-off" />
        <label class="slap-toggle__label" for="bar-breathe-off">Off</label>
        <span class="slap-toggle__flap" aria-hidden="true"><span class="slap-toggle__flap-text">Breathing</span></span>
      </span>
    </span>
    <span class="slap-toggle slap-toggle--small slap-toggle--square js-magnetic" data-strength="25">
      <span class="slap-toggle__control">
        <input class="slap-toggle__radio" type="radio" name="bar-spark" id="bar-spark-on" checked />
        <label class="slap-toggle__label" for="bar-spark-on">Sparkler</label>
        <input class="slap-toggle__radio" type="radio" name="bar-spark" id="bar-spark-off" />
        <label class="slap-toggle__label" for="bar-spark-off">Off</label>
        <span class="slap-toggle__flap" aria-hidden="true"><span class="slap-toggle__flap-text">Sparkler</span></span>
      </span>
    </span>
    <span class="slap-toggle slap-toggle--small slap-toggle--square js-magnetic" data-strength="25">
      <span class="slap-toggle__control">
        <input class="slap-toggle__radio" type="radio" name="bar-fire" id="bar-fire-on" />
        <label class="slap-toggle__label" for="bar-fire-on">Fireworks</label>
        <input class="slap-toggle__radio" type="radio" name="bar-fire" id="bar-fire-off" checked />
        <label class="slap-toggle__label" for="bar-fire-off">Off</label>
        <span class="slap-toggle__flap" aria-hidden="true"><span class="slap-toggle__flap-text">Off</span></span>
      </span>
    </span>
  </span>
</header>
