<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POST BLOCKOUT — 4 variants, greybox</title>
<!--
  POST / article page — the SHARED template (project write-ups AND ramblings both use it).
  GREYBOX LAW: geometry only. One grey language for every variant, so they stay comparable.
  No colour, no accent, no second typeface, no real type treatment. Dashed 1.5px = placeholder,
  solid = real structure. Grey tokens are landing-blockout.html's, reused exactly.

  Every variant is TRANSCRIBED from a real, currently-live site, read from its own CSS:
    CYANILUX  cyanilux.com/tutorials/urp-shader-code/      style.css 13,301 bytes, zero images
    KLUBNIKA  mikeklubnika.com/logs/log_1                  main.css 8,021 bytes
    IQ        iquilezles.org/articles/raymarchingdf/       style.css 4,487 bytes (whole site)
    DIMDEN    dimden.dev/blog/13-optimizing-rendering...   blog.css 3,404 bytes

  Frozen slots, present in ALL four (a variant may reshape a slot, never delete it):
    header (title/desc/tags/date/read-time) · hero media · TOC · TL;DR · prose · code ·
    takeaway · prev/next · related posts
-->
<style>
  *{box-sizing:border-box}
  body{background:#141414;color:#d9d9d9;font-family:ui-monospace,"SF Mono",Consolas,monospace;
    margin:0;padding-top:72px}

  /* ---- shared greybox furniture ---------------------------------------- */
  .box{border:1.5px dashed #555;background:#1b1b1b}
  .solid{border:1.5px solid #666;background:#1b1b1b}
  .fill{display:grid;place-items:center;height:100%;color:#666;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:4px}
  .slot{position:relative;margin-bottom:14px}
  .slot .yy{position:absolute;right:6px;top:-13px;font-size:9px;color:#777}

  /* top bar — same 72px chrome on every variant, not what we are testing */
  .nav{position:fixed;top:0;left:0;right:0;height:72px;z-index:10;background:#1f1f1f;
    border-bottom:1.5px solid #666;display:flex;align-items:center;gap:16px;padding:0 20px}
  .nav .ico{width:44px;height:44px;border:1.5px dashed #777;display:grid;place-items:center;
    font-size:9px;color:#888}
  .nav .name{border:1.5px dashed #666;padding:8px 18px;font-size:13px;color:#ccc}
  .nav .sp{flex:1}
  .nav .btns span{border:1.5px dashed #666;padding:7px 16px;font-size:10px;color:#999;margin-left:6px}

  /* the scene shows through everywhere the article is not */
  .ground{min-height:calc(100vh - 72px);background:#141414;padding-bottom:90px}

  h1,h2,h3,p{margin:0}
  .lines span{display:block;height:1px;background:#3a3a3a;margin:0 0 12px}
  .lines .short{width:62%}

  /* ===================================================================== */
  /* V1 · STRIPE.DEV — 24-col spine, STICKY METADATA RAIL (Rod's pick)      */
  /* Measured on https://stripe.dev/blog/what-it-feels-like-building-with- */
  /* stripe-projects at 1440: 24 cols x 58.375px, container 1425.          */
  /* Rail = EXACTLY 6 cols (350px) at top:60px, and it FOLLOWS THE SCROLL  */
  /* — that following rail is the thing Rod named.                         */
  /* Prose = EXACTLY 12 cols (701px) starting x=421, so 1 col of gutter    */
  /* and ~5 cols of bare right margin. The layout is NOT centred.          */
  /* ===================================================================== */
  body.stripe .art{display:grid;grid-template-columns:repeat(24,1fr);width:min(1425px,99vw);
    margin:0 auto;column-gap:0;padding:0}
  body.stripe .st-title{grid-column:1/-1;font-size:clamp(2.6rem,7vw,101px);line-height:.92;
    font-weight:300;letter-spacing:-.06em;padding:56px 12px 42px}
  body.stripe .st-rail{grid-column:1/span 6;position:sticky;top:60px;align-self:start;
    padding:0 18px 0 12px}
  body.stripe .st-body{grid-column:8/span 12}
  body.stripe .st-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    padding:9px 0;border-bottom:1px solid #3a3a3a;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:#888}
  body.stripe .st-lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#666;
    padding-bottom:7px;margin-bottom:12px;border-bottom:1px solid #3a3a3a}
  body.stripe .st-btn{display:block;text-align:center;border:1px solid #666;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;color:#999;padding:9px;margin-top:9px}
  body.stripe .st-sec{margin-top:56px}     /* their section rhythm */
  body.stripe .code{background:#101010;min-height:200px;padding:18px}
  body.stripe .h2bar{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888;
    margin:0 0 14px}
  body.stripe .notice{border:0;background:none;min-height:70px;border-top:1px solid #3a3a3a;
    border-bottom:1px solid #3a3a3a;padding:14px 0}
  body.stripe .rel{border:1.5px dashed #555;background:#1b1b1b;height:150px}

  /* ===================================================================== */
  /* V2 · CYANILUX — contained rounded card, heading BARS carry the rhythm  */
  /* ===================================================================== */
  body.cyanilux .art{width:70%;margin:0 auto;border:3px solid #666;border-radius:20px;
    padding:30px;background:#181818;box-shadow:5px 5px 10px 0 #000}
  @media(min-width:1200px){body.cyanilux .art{width:60%}}
  @media(max-width:1000px){body.cyanilux .art{width:85%}}
  @media(max-width:600px){body.cyanilux .art{width:90%;padding:10px}}
  body.cyanilux .hdr{text-align:center;padding-bottom:20px}
  body.cyanilux .h2bar{height:36px;border-radius:7px;border-left:10px solid #666;
    background:#1f1f1f;margin-top:30px;display:flex;align-items:center;padding:0 20px;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888}
  body.cyanilux .notice{display:flex;border:3px solid #666;border-radius:10px;background:#1b1b1b;
    min-height:96px;margin:5px 0}
  body.cyanilux .notice .gut{width:24px;border-radius:6px 0 0 6px;margin-right:10px;
    background:repeating-linear-gradient(45deg,#1b1b1b,#1b1b1b 12px,#232323 12px,#232323 24px)}
  body.cyanilux .notice .chip{width:28px;height:28px;border-radius:100%;border:1.5px dashed #666;
    margin:15px 10px;flex:none}
  body.cyanilux .code{background:#101010;min-height:180px;padding:20px;border-radius:0}
  body.cyanilux .pill{border:3px solid #666;border-radius:15px;padding:5px 20px;font-size:10px;
    color:#999;box-shadow:5px 5px 10px 0 #000}
  body.cyanilux .rel{border-radius:10px;background:#1e1e1e;height:84px;margin-top:20px;
    border:1.5px dashed #555}

  /* ===================================================================== */
  /* V2 · KLUBNIKA — document SHEET, side hairlines only, DOTTED rules      */
  /* ===================================================================== */
  body.klubnika .art{max-width:58em;width:100%;margin:0 auto;padding:10px 15px;
    border-left:1px solid #5c5c5c;border-right:1px solid #5c5c5c;
    background:linear-gradient(0deg,#141414 0%,#1e1e1e 91%,#141414 100%)}
  body.klubnika .rule{border:0;border-top:1px dotted #666;margin:20px 0 16px}
  body.klubnika .lr{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  body.klubnika .code{background:#101010;min-height:200px;padding:15px;
    border-top:1px solid #5c5c5c;border-bottom:1px solid #5c5c5c;border-left:0;border-right:0}
  body.klubnika .notice{padding:0;border:0;background:none;min-height:66px}
  body.klubnika .h2bar{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888;
    margin:0 0 12px}
  body.klubnika .rel{height:38px;border:0;border-bottom:1px dotted #666;background:none}

  /* ===================================================================== */
  /* V3 · IQ — 120ch measure, no chrome at all, TOC as a wrapping WALL      */
  /* ===================================================================== */
  body.iq{font-size:18px}
  body.iq .art{width:100%;max-width:120ch;margin:0 auto;padding:32px 24px 0}
  body.iq .hdr{display:flex;flex-direction:column;align-items:center;padding-bottom:48px}
  body.iq .tocwall{display:flex;justify-content:space-around;flex-wrap:wrap}
  body.iq .tocwall .part{width:30%;padding:0 32px 32px 0}
  body.iq .part75{width:75%}
  body.iq .part70{width:70%}
  body.iq .code{background:#101010;min-height:200px;padding:0}
  body.iq .h2bar{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888;
    margin:32px 0 12px}
  body.iq .notice{border:0;background:none;min-height:90px}
  body.iq .rel{height:84px;border:1.5px dashed #555;background:#1b1b1b}

  /* ===================================================================== */
  /* V4 · DIMDEN — no shell, no centring; content capped, chrome uncapped   */
  /* ===================================================================== */
  body.dimden .ground{padding:35px}
  body.dimden .art{max-width:1200px;margin:0}          /* NOT auto — the asymmetry IS the layout */
  body.dimden .logo{width:380px;height:60px;margin:0 auto 18px}
  body.dimden .rule{height:4px;border:0;background:#3a3a3a;margin:24px 0}
  body.dimden .toc3{display:flex;justify-content:center}
  body.dimden .toc3 > div{padding:40px;flex:1}
  body.dimden .code{background:#0d0d0d;min-height:220px;padding:16px}
  body.dimden .notice{border:0;background:none;min-height:66px}
  body.dimden .h2bar{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#888;
    margin:0 0 12px}
  body.dimden .rel{height:38px;border:0;background:none;border-bottom:1px solid #2c2c2c}

  /* ---- lab tooling ------------------------------------------------------ */
  #prov{position:fixed;left:14px;top:88px;z-index:70;width:292px;max-height:calc(100vh - 176px);
    overflow:auto;background:rgba(10,12,20,.96);border:1px solid rgba(255,255,255,.18);
    padding:12px 13px;font:11px/1.55 ui-monospace,Consolas,monospace;color:#dcdcdc}
  #prov .pv-t{font-size:12.5px;color:#fff;margin-bottom:2px}
  #prov .pv-k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8e8e8e;margin-bottom:7px}
  #prov a{color:#9fd0ff;word-break:break-all}
  #prov h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8e8e8e;margin:9px 0 3px}
  #prov ul{margin:0;padding-left:14px}#prov li{margin-bottom:3px;color:#c8c8c8}
  #prov .warn li{color:#ffb020}
  .vbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:80;display:flex;
    gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(8,10,18,.96);
    border:1px solid rgba(255,255,255,.2);padding:7px 9px}
  .vbar button{background:none;border:1px solid #555;color:#bbb;font:10px ui-monospace,monospace;
    letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;cursor:pointer}
  .vbar button:hover{border-color:#fff;color:#fff}
  .vbar button.on{background:#ddd;border-color:#ddd;color:#141414}
  .labtag{position:fixed;left:14px;bottom:12px;z-index:50;font:10px ui-monospace,monospace;
    color:rgba(245,243,239,.45)}
  @media(max-width:1300px){#prov{position:static;width:auto;max-height:none;margin:10px 14px}}
</style>
</head>

<script>
/* Slot builder. Every variant renders the SAME frozen slot list; only the shape changes.
   `note` is the measured number from the source site, shown top-right of each slot. */
function slot(label, h, note, cls){
  return '<div class="slot"><span class="yy">'+(note||'')+'</span>'
       + '<div class="'+(cls||'box')+'" style="height:'+h+'px"><div class="fill">'+label+'</div></div></div>';
}
function lines(n, w){
  var s='<div class="lines">';
  for(var i=0;i<n;i++) s+='<span'+(i===n-1?' class="short"':'')+' style="width:'+(i===n-1?'62%':(w||'100%'))+'"></span>';
  return s+'</div>';
}

var BUILD = {
  stripe: function(){
    return '<h1 class="st-title"><div class="box" style="height:100px"><div class="fill">H1 TITLE &mdash; 101/93, weight 300, tracking -0.06em</div></div></h1>'
      + '<aside class="st-rail">'
      +   '<div class="st-lab">/ metadata</div>'
      +   '<div class="st-row"><span>Date</span><b>2026.5.26</b></div>'
      +   '<div class="st-row"><span>Author</span><b>NAME</b></div>'
      +   '<div class="st-row"><span>Reading time</span><b>7 min read</b></div>'
      +   '<div class="st-row"><span>Categories</span><b>TAG &nbsp; TAG</b></div>'
      +   '<div class="st-lab" style="margin-top:26px">/ contents &mdash; NOT stripe&rsquo;s</div>'
      +   '<div class="st-row"><span>01 Section</span></div>'
      +   '<div class="st-row"><span>02 Section</span></div>'
      +   '<div class="st-row"><span>03 Section</span></div>'
      +   '<div class="st-row"><span>04 Takeaway</span></div>'
      +   '<div class="st-lab" style="margin-top:26px">/ agents</div>'
      +   '<div class="st-btn">Copy for LLM</div><div class="st-btn">View as Markdown</div>'
      +   '<div class="st-lab" style="margin-top:26px">/ share</div>'
      +   '<div class="st-btn">Twitter / X</div><div class="st-btn">LinkedIn</div>'
      +   '<div class="yy" style="display:block;position:static;margin-top:14px">RAIL = 6 COLS (350px), top:60px &mdash; FOLLOWS THE SCROLL</div>'
      + '</aside>'
      + '<div class="st-body">'
      +   '<div class="st-lab">/ article</div>'
      +   slot('HERO MEDIA 16:9',394,'701x394 &mdash; 12 cols')
      +   '<div class="notice"><div class="fill">TL;DR &mdash; hairline top and bottom, no box</div></div>'
      +   '<div class="st-sec"><div class="h2bar">SECTION HEADING &mdash; 48/48, weight 300</div>'
      +   lines(6) + lines(5) + '</div>'
      +   '<div class="slot" style="margin-top:24px"><span class="yy">701 wide, fill #101010</span>'
      +   '<div class="code"><div class="fill">CODE BLOCK</div></div></div>'
      +   '<div class="st-sec"><div class="h2bar">SECTION HEADING</div>' + lines(6) + '</div>'
      +   '<div class="notice" style="margin-top:56px"><div class="fill">TAKEAWAY</div></div>'
      +   '<div class="st-sec" style="display:flex;justify-content:space-between;gap:20px">'
      +   '<div class="box" style="flex:1;height:44px"><div class="fill">&larr; PREV</div></div>'
      +   '<div class="box" style="flex:1;height:44px"><div class="fill">NEXT &rarr;</div></div></div>'
      +   '<div class="st-sec"><div class="h2bar">RELATED ARTICLES</div>'
      +   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">'
      +   '<div class="rel"><div class="fill">RELATED</div></div>'
      +   '<div class="rel"><div class="fill">RELATED</div></div></div></div>'
      +   '<div style="height:120px"></div>'
      + '</div>';
  },
  cyanilux: function(){
    return '<div class="hdr">'
      + slot('H1 TITLE',56,'948x56, centred')
      + slot('DESCRIPTION',40,'948x40')
      + '<div class="slot"><span class="yy">meta row 30px, pills 90x24, r10</span><div style="display:flex;gap:6px;justify-content:center;align-items:center;height:30px">'
      + '<span class="box" style="width:90px;height:24px"><span class="fill">TAG</span></span>'
      + '<span class="box" style="width:90px;height:24px"><span class="fill">TAG</span></span>'
      + '<span class="box" style="width:120px;height:24px"><span class="fill">DATE</span></span>'
      + '<span class="box" style="width:90px;height:24px"><span class="fill">10 MIN</span></span></div></div>'
      + '</div>'
      + slot('HERO MEDIA 16:9',533,'948x533, bare inside card')
      + '<div class="slot"><span class="yy">.notice — 3px border, r10, 24px hatched gutter</span>'
      + '<div class="notice"><div class="gut"></div><div class="chip"></div>'
      + '<div class="fill" style="flex:1">TL;DR</div></div></div>'
      + '<div class="h2bar">CONTENTS &mdash; plain nested list, NOT sticky</div>'
      + slot('TOC · 8 rows x 26px, 24px indent per level',208,'948x208')
      + '<div class="h2bar">SECTION HEADING &mdash; filled bar, 36px, 10px left rule</div>'
      + lines(6) + lines(5)
      + '<div class="slot"><span class="yy">948 wide, fill #101010, pad 20, 24px rows</span><div class="code"><div class="fill">CODE BLOCK</div></div></div>'
      + '<div class="h2bar">SECTION HEADING</div>' + lines(6)
      + '<div class="slot"><span class="yy">second .notice, identical geometry</span>'
      + '<div class="notice"><div class="gut"></div><div class="chip"></div>'
      + '<div class="fill" style="flex:1">TAKEAWAY</div></div></div>'
      + '<div class="slot" style="display:flex;justify-content:space-between;margin-top:30px">'

      + '<div class="h2bar">RELATED POSTS</div>'
      + '<div class="rel"><div class="fill">RELATED CARD &mdash; 84px, r10</div></div>'
      + '<div class="rel"><div class="fill">RELATED CARD</div></div>'
      + '<div class="rel"><div class="fill">RELATED CARD</div></div>';
  },
  klubnika: function(){
    return '<div class="lr"><div style="flex:1">'+slot('H1 TITLE · 27px',34,'')+'</div>'
      + '<div style="width:180px">'+slot('DATE',34,'')+'</div></div>'
      + '<div class="lr"><div style="flex:1">'+slot('TAGS · plain text run',22,'')+'</div>'
      + '<div style="width:140px">'+slot('READ TIME',22,'')+'</div></div>'
      + slot('DESCRIPTION · 2 lines x 22px',44,'header stack ~112px')
      + '<hr class="rule">'
      + slot('HERO MEDIA 16:9',505,'898x505')

      + '<hr class="rule">'

      + '<hr class="rule">'
      + '<div class="h2bar">SECTION HEADING · 20px</div>'
      + lines(7) + lines(6)

      + '<div class="h2bar">SECTION HEADING</div>' + lines(6)
      + '<hr class="rule">'

      + '<hr class="rule">'
      + '<div class="lr">'+slot('&larr; PREV',30,'')+slot('NEXT &rarr;',30,'')+'</div>'
      + '<hr class="rule">'
      + '<div class="h2bar">RELATED</div>'
      + '<div class="rel"><div class="fill">RELATED &mdash; dotted-rule row</div></div>'
      + '<div class="rel"><div class="fill">RELATED</div></div>'
      + '<div class="rel"><div class="fill">RELATED</div></div>';
  },
  iq: function(){
    var w='';
    for(var i=0;i<6;i++) w+='<div class="part"><div class="box" style="height:24px"><div class="fill">TOC '+(i+1)+'</div></div></div>';
    return '<div class="hdr">'
      + '<div style="width:100%">'+slot('H1 TITLE',64,'container 120ch — measure tracks the FONT')+'</div>'
      + '<div style="width:100%">'+slot('DESCRIPTION',36,'')+'</div>'
      + '<div style="width:100%">'+slot('TAGS · DATE · READ TIME — one centred run',24,'header stack 172px')+'</div>'
      + '</div>'
      + slot('HERO MEDIA 16:9',608,'full container, bare')
      + '<div class="slot"><span class="yy">TOC as a WRAPPING WALL — .part30 x 6, 3-up</span>'
      + '<div class="tocwall">'+w+'</div></div>'
      + '<div class="part75">'+slot('TL;DR · .part75 sub-width block, no box',90,'75% = 810px')+'</div>'
      + '<div class="h2bar">SECTION HEADING</div>'
      + lines(6) + lines(7)
      + '<div class="slot"><span class="yy">flush to the measure, no padding/border/radius</span><div class="code"><div class="fill">CODE BLOCK</div></div></div>'
      + '<div class="h2bar">SECTION HEADING</div>' + lines(6)
      + '<div class="part70">'+slot('TAKEAWAY · .part70 block',84,'70%')+'</div>'
      + '<div class="slot" style="display:flex;justify-content:space-between;gap:20px">'
      + '<div class="box" style="flex:1;height:44px"><div class="fill">&larr; PREV</div></div>'
      + '<div class="box" style="flex:1;height:44px"><div class="fill">NEXT &rarr;</div></div></div>'
      + '<div class="h2bar">RELATED &mdash; wrapping media wall</div>'
      + '<div class="tocwall">'
      + '<div class="part" style="width:30%"><div class="rel"><div class="fill">RELATED</div></div></div>'
      + '<div class="part" style="width:30%"><div class="rel"><div class="fill">RELATED</div></div></div>'
      + '<div class="part" style="width:30%"><div class="rel"><div class="fill">RELATED</div></div></div>'
      + '</div>';
  },
  dimden: function(){
    return '<div class="logo box"><div class="fill">LOGO &mdash; 380px, the ONE centred element</div></div>'
      + slot('H1 TITLE · 32px',40,'')
      + slot('DATE &middot; TAGS &middot; READ TIME — one meta line, 20px',26,'')
      + slot('DESCRIPTION — one line',26,'header stack ~150px')
      + '<hr class="rule">'
