<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HERO TESTS — harumaki main vs ndt placement</title>
<!--
  ===== HERO TESTS (2026-08-14) =====
  Rod: the current hero "has no origin and is just AI generated". Correct - centring name, role and
  a paragraph in an empty screen appears NOWHERE in the reference set. Rod picked the two heroes he
  wants tried: harumaki main and harumaki /ndt/, on the grounds that stephanewillems works because
  the type gets out of the way so you look at the SCENE. Same reason harumaki works, harder.

  Three variants, all over the live lantern scene, all using his real name and role.
  The role stays in every one (Rod: "I will 100% want the role under the name"). The paragraph
  tagline is GONE - no site in the harumaki family carries one.

  GEOMETRY IS TRANSCRIBED, NOT INVENTED (source CSS re-fetched 2026-08-14):
    main  harumakigohan.com - hand-lettered mark centred near the top, a tiny wide-tracked
          subtitle directly beneath it ("OFFICIAL SITE"), scene owning everything below.
          Their mark is artwork; proportions taken from the verified capture.
    ndt   harumakigohan.com/ndt/ pins exactly two blocks and leaves the middle to the art:
            .release      { position:absolute; top:80px; left:50px; width:35%; min-width:400px }
            .logo,.logoback { position:absolute; top:0; right:0; width:20%; min-width:250px }
          v2 and v3 are those two slots with name and role swapped.

  HONEST CAVEAT ON THE VERTICAL TEXT: ndt's vertical title is an IMAGE (img/logo.png), not type.
  There is no writing-mode anywhere in their CSS. The vertical variants here use CSS
  writing-mode:vertical-rl, so they borrow the PLACEMENT faithfully and approximate the look.
  Real vertical lettering would be an art asset, like the seam bands.
-->
<link rel="stylesheet" href="/redesign-lab/foundations.css">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/redesign-lab/extracted/styles/settings.css">
<link rel="stylesheet" href="/redesign-lab/extracted/components/goo-toggle/goo-toggle.css">
<link rel="stylesheet" href="/redesign-lab/extracted/components/favicon/favicon.css">
<link rel="stylesheet" href="/redesign-lab/extracted/components/top-bar/top-bar.css">
<link rel="stylesheet" href="/redesign-lab/extracted/components/slap-toggle/slap-toggle.css">
<link rel="stylesheet" href="/redesign-lab/extracted/components/hero/hero.css">
<style>
/* The universal reset lives in foundations.css, inside @layer reset, and this page loads it.
   The duplicate that sat here was UNLAYERED, and unlayered CSS outranks every layer - so
   margin:0;padding:0 was wiping the padding of every layered component on the page. */
body{background:var(--color-night);color:var(--color-text);font-family:var(--font-body);line-height:1.7;overflow-x:hidden}
#hana-bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--color-night);pointer-events:none;opacity:0}
.top-bar{position:sticky;top:0;z-index:60}

/* the hero is a full screen in every variant; only the TYPE placement changes */
.h{position:relative;height:calc(100vh - 96px);min-height:520px}
/* name and role are each split into word spans (.h__col) so the vertical variants can give every
   word its own column. Horizontally they just sit in a row with a gap. */
.h__name{font-family:var(--font-hand);color:var(--color-gold-deep);line-height:1;white-space:nowrap;
  display:flex;gap:.3em}
.h__role{font-family:var(--font-mono);color:var(--color-muted);text-transform:uppercase;white-space:nowrap;
  display:flex;gap:.36em}
body.v1 .h__name,body.v1 .h__role,body.ctl .h__name,body.ctl .h__role{justify-content:center}
/* the middot only belongs between the two roles when they share ONE line */
body.v1 .h__role .h__col+.h__col::before,
body.v5 .h__role .h__col+.h__col::before,
body.ctl .h__role .h__col+.h__col::before{content:'\00b7\00a0'}

/* scroll cue sits bottom-centre in every variant, as it does on harumaki main */
.h__cue{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);color:var(--color-gold);
  opacity:.75;font-size:26px;line-height:1;animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}
@media (prefers-reduced-motion:reduce){.h__cue{animation:none}}

/* social rail, pinned right - harumaki main has one in the same place */
.h__social{position:absolute;right:26px;top:50%;transform:translateY(-50%);display:grid;gap:14px;
  font-family:var(--font-mono);font-size:.62rem;letter-spacing:.1em}
.h__social a{color:var(--color-muted);text-decoration:none}
.h__social a:hover{color:var(--color-gold)}

/* ---- V1 MAIN: mark centred near the top, tiny wide-tracked subtitle directly beneath ---- */
body.v1 .h__name{position:absolute;left:50%;top:11%;transform:translateX(-50%);font-size:clamp(2.6rem,5.2vw,4.4rem)}
body.v1 .h__role{position:absolute;left:50%;top:calc(11% + 4.6rem);transform:translateX(-50%);
  font-size:.6rem;letter-spacing:.42em}

/* ---- NDT VERTICAL BLOCK (v2 role, v3 name) ----------------------------------------------
   Measured off the capture, not guessed. ndt stacks the title as ONE COLUMN PER WORD, four of
   them, all TOP-ALIGNED so the short word ends high and the long one hangs low. They read
   RIGHT TO LEFT (NEO rightmost, then DREAM, then TRAVELER, with a thin kana credit column
   outside them), which is why row-reverse is used rather than reordering the markup.
   The Latin letters are SIDEWAYS, not upright, so vertical-rl's default orientation is correct.
   Slot geometry is their CSS verbatim: top:0; right:0; width:20%; min-width:250px. */
body.v2 .h__role,
body.v3 .h__name{
  position:absolute;top:0;right:0;width:20%;min-width:250px;
  display:flex;flex-direction:row-reverse;align-items:flex-start;
  gap:.62em;padding:48px 34px 0 0}
body.v2 .h__role .h__col,
body.v3 .h__name .h__col{writing-mode:vertical-rl;letter-spacing:.13em;line-height:1}

body.v2 .h__role{font-size:clamp(.92rem,1.5vw,1.25rem);color:var(--color-gold-deep);letter-spacing:0}
body.v3 .h__name{font-size:clamp(1.9rem,3.4vw,2.9rem)}

/* the horizontal partner block, their .release slot: top:80px; left:50px */
body.v2 .h__name,
body.v3 .h__role{position:absolute;top:80px;left:50px;display:flex;gap:.3em}
body.v2 .h__name{font-size:clamp(2.2rem,4vw,3.4rem)}
body.v3 .h__role{font-size:.62rem;letter-spacing:.42em}

/* ==== V4 and V5 - MY INTERPRETATION after D10 =============================================
   D10 says the scene IS the handmade signature (shader work, not drawn art). Rod's own read of
   stephanewillems was that it works because the type gets out of the way so you look at the
   scene. And he spotted that the name is already in the sticky top bar, so repeating it in the
   hero is the same element twice. v4 and v5 take those three things seriously.
   IDEA ORIGIN: claude. The placements are sourced, the decision to go this far is mine. ==== */

/* V4 - the name leaves the hero entirely. The bar already carries identity, so the hero carries
   only the role, small and vertical at the edge, and the scene owns the whole screen.
   Slot geometry from ndt's .logo; demoting the name is stephanewillems' move. */
body.v4 .h__name{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
  white-space:nowrap} /* hidden visually, KEPT for screen readers - the page still needs its h1 */
body.v4 .h__role{position:absolute;top:0;right:0;width:20%;min-width:250px;
  display:flex;flex-direction:row-reverse;align-items:flex-start;gap:.62em;padding:48px 34px 0 0;
  font-size:.72rem;letter-spacing:.28em;color:var(--color-gold-deep)}
body.v4 .h__role .h__col{writing-mode:vertical-rl;line-height:1}

/* V5 - the name as a SIGNATURE on the scene rather than a headline: small, low, bottom-left,
   the way a painting is signed. Role directly beneath in harumaki's tiny wide-tracked treatment.
   The middle of the screen stays empty, which is the whole point.
   Bottom-edge anchoring is lukebaffait (verified capture); the tiny subtitle under the mark is
   harumaki main. The combination is mine. */
body.v5 .h__name{position:absolute;left:50px;bottom:104px;font-size:clamp(1.7rem,2.8vw,2.4rem)}
body.v5 .h__role{position:absolute;left:53px;bottom:78px;font-size:.58rem;letter-spacing:.34em}

/* V6 - Rod's synthesis: V5's demoted signature name PLUS V2's vertical role column.
   His reasoning, and it is right: ndt's vertical block "cuts the opening page into an interesting
   shape", but only because the string is LONG. Measured in the same slot, his role columns run
   172px and 140px while his name columns run 92px and 48px - "rodney"/"fan" cannot cut a frame.
   So the roles map to ndt's TITLE (long, vertical, cutting the edge) and the name maps to ndt's
   small credit column, which is the demotion V5 already does. Middle stays empty for the scene.

   MEASURED OFF THE ASSET (Rod 2026-08-14): ndt's block is ~224 x 656px at 1440x1080, i.e. about
   15.6% of the width and 61% of the VIEWPORT HEIGHT. The earlier attempt set the type at ~15px,
   which filled maybe a sixth of that. To fill 61% with a 10-character column the type has to run
   near 50px. Matching the FOOTPRINT is the point; ndt's non-uniform letter sizes, undersized E's
   and the blue fills inside the R/D/O are hand-drawn and deliberately not attempted.
   Three columns per Rod: [rodney fan][technical][artist] here, [rodney fan][game][designer] on
   the design page. His name becomes one of the columns, so the bottom-left slot frees up for a
   LIVE CLOCK - which has a real precedent: 109ichiki runs one in its frame gutter. */
body.v6 .h__name,
body.v6 .h__role{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
  white-space:nowrap} /* hidden visually, kept for screen readers */
body.v6 .h__vert{display:flex}
body.v6 .h__clock{display:block}
/* V6 takes the rail off the hero centre and hangs it under the vertical name instead (see the
   script). The centring transform has to go with it, or the rail rides half its height back up. */
body.v6 .h__social{transform:none}

.h__vert{display:none;position:absolute;top:0;right:0;width:20%;min-width:280px;
  flex-direction:row-reverse;align-items:flex-start;gap:.34em;padding:48px 30px 0 0}
/* text-orientation:upright - CORRECTED 2026-08-14 (Rod: "text is also the wrong way up").
   I had claimed ndt's Latin letters were sideways because that is vertical-rl's default. The asset
   shows the opposite: every letter stands UPRIGHT, stacked like a marquee sign. Upright also
   changes the sizing maths, since each glyph then takes a full em of vertical advance instead of
   roughly half, so the type is smaller here than in the sideways attempt while filling MORE height.
   Target remains ndt's footprint, ~61% of viewport height. */
/* Rod 2026-08-14: must stop ABOVE the social rail, and the columns must be WIDER. Those pull
   against each other - upright stacking makes a bigger font both wider and taller. So:
     line-height  widens the column box (in vertical writing mode it is the INLINE axis)
     letter-spacing NEGATIVE pulls the stack back up so 10 characters clear the social rail

   SIZED IN vh, NOT vw ("wrong when scaled", Rod). This block's HEIGHT is what has to clear the
   social rail, and the rail sits at 50% of the hero - a height-derived position. Sizing the type
   in vw meant the column grew with WIDTH while its runway shrank with HEIGHT, so a wide-short
   window collided and a tall-narrow one under-filled. Both axes now derive from height, so the
   proportion holds at any aspect ratio. */
.h__vert .h__col{writing-mode:vertical-rl;text-orientation:upright;text-transform:uppercase;
  letter-spacing:-.23em;line-height:1.7;
  font-family:var(--font-hand);color:var(--color-gold-deep);font-size:clamp(1.05rem,2.9vh,2.9rem)}
/* the clock is a MAIN ATTRACTION (Rod), not a footnote: large, left-anchored, low in the frame.
   Tabular figures so the digits do not jitter as the seconds tick. */
.h__clock{display:none;position:absolute;left:50px;bottom:14%;
  font-family:var(--font-mono);font-size:clamp(2.2rem,7vh,4.6rem);line-height:1;
  letter-spacing:.06em;color:var(--color-text);font-variant-numeric:tabular-nums}

/* ---- CONTROL: what is on the assembly today, for reference ---- */
body.ctl .h{display:grid;place-content:center;text-align:center;gap:.4rem}
body.ctl .h__name{position:static;font-size:clamp(2.6rem,5.2vw,4.4rem)}
body.ctl .h__role{position:static;font-size:.66rem;letter-spacing:.36em}
body.ctl .h__tagline{display:block;max-width:46ch;margin:1.1rem auto 0;color:var(--color-text);opacity:.85}
.h__tagline{display:none}

/* ---- lab tooling ---- */
#prov{position:fixed;left:14px;top:104px;z-index:70;width:290px;max-height:calc(100vh - 130px);overflow:auto;
  background:rgba(10,12,20,.94);border:1px solid rgba(255,255,255,.18);padding:12px 13px;
  font:11px/1.55 ui-monospace,Consolas,monospace;color:#dcdcdc}
#prov .pv-t{font-size:12.5px;color:#fff;margin-bottom:2px}
#prov .pv-k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8e8e8e;margin-bottom:7px}
#prov h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8e8e8e;margin:9px 0 3px}
#prov ul{margin:0;padding-left:14px}#prov li{margin-bottom:3px;color:#c8c8c8}
#prov .warn li{color:#ffb020}
#prov code{color:#9fd0ff}
.vbar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:80;display:flex;gap:6px;flex-wrap:wrap;
  justify-content:center;background:rgba(8,10,18,.94);border:1px solid rgba(255,255,255,.2);padding:7px 9px}
.vbar button{background:none;border:1px solid #555;color:#bbb;font:10px ui-monospace,monospace;letter-spacing:.08em;
  text-transform:uppercase;padding:5px 11px;cursor:pointer}
.vbar button:hover{border-color:var(--color-gold);color:var(--color-gold)}
.vbar button.on{background:var(--color-gold);border-color:var(--color-gold);color:var(--color-night)}
.labtag{position:fixed;left:14px;bottom:12px;z-index:50;font:10px ui-monospace,monospace;color:rgba(245,243,239,.45)}
.labtag a{color:var(--color-gold)}
@media(max-width:1200px){#prov{position:static;width:auto;max-height:none;margin:10px 14px}}
</style>
</head>
<body class="v1">
<div id="hana-bg"></div>

<header class="top-bar">
  <div class="top-bar__left">
    <a class="favicon favicon--square" href="#" aria-label="Home">
      <span class="favicon__magnet"><img class="favicon__img" src="/assets/img/favicons/favicon.svg" alt="" width="24" height="24" /></span>
    </a>
    <span class="top-bar__logo">RODNEY FAN</span>
  </div>
  <nav class="top-bar__nav">
    <a class="top-bar__link is-active" href="#">Home</a>
    <a class="top-bar__link" href="#">Projects</a>
    <a class="top-bar__link" href="#">About</a>
    <a class="top-bar__link" href="#">Ramblings</a>
  </nav>
  <span class="top-bar__toggles"></span>
</header>

<main>
  <section class="h">
    <!-- split into words so the vertical variants can run one column per word, as ndt does -->
    <h1 class="h__name"><span class="h__col">rodney</span><span class="h__col">fan</span></h1>
    <p class="h__role"><span class="h__col">technical artist</span><span class="h__col">game designer</span></p>
    <p class="h__tagline">// shaders, tools &amp; little worlds, a night market of tech-art experiments, lit one lantern at a time.</p>
    <!-- V6 only: three vertical columns matching ndt's structure, plus a live clock where the
         signature name used to sit. The h1 and role above stay in the markup for screen readers. -->
    <div class="h__vert" aria-hidden="true">
      <span class="h__col">rodney fan</span><span class="h__col">technical</span><span class="h__col">artist</span>
    </div>
    <p class="h__clock" aria-hidden="true">--:--:--</p>
    <nav class="h__social" aria-label="Social links">
      <a href="#">AS</a><a href="#">IO</a><a href="#">GH</a><a href="#">X</a>
    </nav>
    <div class="h__cue" aria-hidden="true">&darr;</div>
  </section>
  <div style="height:60vh" aria-hidden="true"></div>
</main>

<aside id="prov"></aside>
<div class="vbar">
  <span style="color:#8e8e8e;font:9px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;align-self:center;margin-right:2px">hero</span>
  <button data-v="v1" class="on">1 &middot; main</button>
  <button data-v="v2">2 &middot; name TL, role vert</button>
  <button data-v="v3">3 &middot; role TL, name vert</button>
  <button data-v="v4">4 &middot; role only, no name</button>
  <button data-v="v5">5 &middot; name as signature</button>
  <button data-v="v6">6 &middot; signature + vertical role</button>
  <button data-v="ctl">control (today)</button>
</div>
<div class="labtag"><a href="/redesign-lab/">&larr; lab</a> &middot; hero tests &middot; <a href="/redesign-lab/a3-assembly.html">assembly</a></div>

<script>
var PROV={
 v1:{t:'1 — harumaki main',k:'verified capture',
   moves:['Hand-lettered mark centred near the top, NOT mid-screen and NOT large',
          'Tiny wide-tracked subtitle directly beneath it (their "OFFICIAL SITE" slot)',
          'Everything below the mark belongs to the scene',
          'Social rail pinned right, scroll cue bottom-centre'],
   warn:['Their mark is hand-drawn artwork; this is Caveat standing in for your scribbly name']},
 v2:{t:'2 — ndt, name top-left',k:'verified capture + their CSS',
   moves:['Name in their <code>.release</code> slot: top:80px, left:50px',
          'Role vertical in their <code>.logo</code> slot: top:0, right:0, width:20%, min-width:250px',
          'ONE COLUMN PER WORD, as ndt does: NEO / DREAM / TRAVELER, four columns in all',
          'Columns TOP-ALIGNED and read RIGHT TO LEFT, so the short word ends high',
          'Latin letters sideways, not upright - that is vertical-rl’s default'],
   warn:['ndt’s own title is an IMAGE (img/logo.png), so its exact lettering is artwork - but CSS vertical type is WELL PRECEDENTED here: /ftr/, TUYU, Sengoku Hanabi, Mateusz Urbanowicz, NEW SUSHISM and cortiz.dev all use writing-mode (gallery teardown 2026-08-14). No art asset needed for this.']},
 v3:{t:'3 — ndt inverted',k:'same two slots, swapped',
   moves:['Role in the top-left slot, name running vertically down the right',
          '"rodney" and "fan" get a column each, top-aligned, right to left',
          'Puts the biggest type on the edge, so the sky reads as the subject'],
   warn:['Six sites in the gallery set real CSS vertical type, so this needs no artwork',
         'Swapping the slots is MY variation, not something ndt does']},
 v4:{t:'4 — role only, no name',k:'MY interpretation after D10',
   moves:['The top bar already carries the name, so the hero stops repeating it',
          'Only the role remains: small, vertical, at the edge, in ndt’s <code>.logo</code> slot',
          'The scene owns the entire screen - which D10 says is the actual signature',
          'The h1 is still in the markup for screen readers, only hidden visually'],
   warn:['IDEA ORIGIN: claude. The placement is sourced (ndt slot, stephanewillems’ demote-the-name move); going this far is my call, not something one site does.',
         'Scroll past the hero and NO name is on screen except the bar. That is the trade.']},
 v5:{t:'5 — name as a signature',k:'MY interpretation after D10',
   moves:['Name small and low at the bottom-left, the way a painting is signed, not a headline',
          'Role directly beneath it in harumaki’s tiny wide-tracked treatment',
          'The middle of the screen stays empty for the scene - that is the whole point',
          'Keeps the name in the hero, so it answers the redundancy differently to v4'],
   warn:['IDEA ORIGIN: claude. Bottom-edge anchoring is lukebaffait (verified capture) and the tiny subtitle is harumaki main; the COMBINATION is mine.',
         'If the bar keeps its 2.2rem hand-font name, this is still two names on one screen - v5 assumes the bar gets reduced to the favicon.']},
 v6:{t:'6 — signature + vertical role',k:'ROD’s synthesis',
   moves:['V5’s demoted signature name, bottom-left, plus V2’s vertical column at the right edge',
          'The ROLE goes vertical, because it is the long string: measured in the same slot his role columns run 172px and 140px, his name columns only 92px and 48px',
          'Maps to ndt properly — their long TITLE is vertical, their short CREDIT is small and set aside. Rod’s role is the title, his name is the credit.',
          'Middle of the screen stays empty for the scene'],
   warn:['Assumes the top bar loses its name, same as V5',
         'ndt’s letters are hand-drawn and textured; this is a webfont in the same PLACEMENT']},
 ctl:{t:'Control — what ships today',k:'no origin (this is the problem)',
   moves:['Name, role and a paragraph stacked and centred in an empty screen'],
   warn:['This arrangement appears NOWHERE in the reference set',
         'It treats the scene as wallpaper, which is the one thing nobody else has']}
};
(function(){
  var btns=document.querySelectorAll('.vbar button'), panel=document.getElementById('prov');
  function show(v){
    document.body.className=v;
    btns.forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});
    var p=PROV[v];
    var h='<div class="pv-t">'+p.t+'</div><div class="pv-k">'+p.k+'</div>';
    h+='<h4>placement</h4><ul><li>'+p.moves.join('</li><li>')+'</li></ul>';
    if(p.warn) h+='<h4>honest caveats</h4><ul class="warn"><li>'+p.warn.join('</li><li>')+'</li></ul>';
    panel.innerHTML=h;
  }
  btns.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v);});});
  var m=/[?&]v=(v1|v2|v3|v4|v5|v6|ctl)/.exec(location.search);
  show(m?m[1]:'v1');
})();

/* live clock (v6). 109ichiki runs one in its frame gutter, so the device is sourced, not invented.
   Local time, seconds ticking, so the landing has one thing on it that is genuinely now. */
(function(){
  var el=document.querySelector('.h__clock');
  if(!el) return;
  function tick(){
    var d=new Date(), p=function(n){return String(n).padStart(2,'0')};
    el.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick(); setInterval(tick,1000);
})();

/* V6 only: the social rail measures its distance from the vertical name block instead of from the
   hero centre, using the SAME 48px the block takes from the top bar (Rod 2026-08-16). The block's
   height is type-dependent and clamped in vh, so no CSS constant can express where it ends -
   hence the measure. Every other variant keeps harumaki's centred rail untouched. */
(function(){
  var vert=document.querySelector('.h__vert'), rail=document.querySelector('.h__social'), GAP=48;
  if(!vert||!rail) return;
  function place(){
    if(!document.body.classList.contains('v6')){ rail.style.top=''; return; }
    rail.style.top=(vert.offsetTop+vert.offsetHeight+GAP)+'px';
  }
  new ResizeObserver(place).observe(vert);
  document.querySelectorAll('.vbar button').forEach(function(b){b.addEventListener('click',place);});
  place();
})();
</script>
