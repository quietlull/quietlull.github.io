---
layout: default
---

<div id="listening-test" class="listening-test">
  <div class="page-heading page-heading--sub">
    <h1 class="page-heading__title heading-1-display">{{ page.title }}</h1>
  </div>

  <section data-step="intro">
    <button type="button" class="kit-button kit-button--outline orb-fill listening-test__button" data-action="start">
      <span class="kit-button__label">Start</span>
    </button>
    <p class="listening-test__status" data-status aria-live="polite"></p>
  </section>

  <section data-step="trial" hidden>
    <p class="listening-test__status" data-progress aria-live="polite"></p>
    <div class="listening-test__row">
      <button type="button" class="kit-button kit-button--outline orb-fill listening-test__button listening-test__play" data-play="a" aria-pressed="false">
        <span class="kit-button__label">Play A</span>
      </button>
      <button type="button" class="kit-button kit-button--outline orb-fill listening-test__button listening-test__play" data-play="b" aria-pressed="false">
        <span class="kit-button__label">Play B</span>
      </button>
    </div>
    <div class="listening-test__row">
      <button type="button" class="kit-button kit-button--outline orb-fill listening-test__button" data-choose="a" disabled>
        <span class="kit-button__label">I prefer A</span>
      </button>
      <button type="button" class="kit-button kit-button--outline orb-fill listening-test__button" data-choose="b" disabled>
        <span class="kit-button__label">I prefer B</span>
      </button>
    </div>
  </section>

  <section data-step="results" hidden>
    <ol class="listening-test__results" data-results></ol>
    <template data-result-template>
      <li class="listening-test__result">
        <span class="listening-test__rank" data-field="rank"></span>
        <span class="listening-test__thumb" data-field="image"></span>
        <span class="listening-test__name" data-field="name"></span>
        <span class="listening-test__track"><span class="listening-test__fill"></span></span>
        <span class="listening-test__percent" data-field="percent"></span>
      </li>
    </template>
    <button type="button" class="kit-button kit-button--outline orb-fill listening-test__button" data-action="copy">
      <span class="kit-button__label">Copy results link</span>
    </button>
  </section>
</div>

<script type="application/json" id="listening-test-data">
  {
    "switches": {{ page.switches | jsonify }},
    "takes": {{ page.takes }},
    "controls": {{ page.controls }},
    "media": {{ page.media | relative_url | jsonify }},
    "placeholder": {{ '/assets/img/placeholder-wip.svg' | relative_url | jsonify }}
  }
</script>
