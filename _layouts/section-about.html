---
layout: default
refactor: true
script_includes:
  - about-scripts
---

{% include lang.html %}

<div id="about-page">
  <div class="wrapper-content-column">

    <section class="band hero">
      <div class="hero__fill">
        <div class="sect">
          <h1 class="section-head"><span class="section-head__name">About me</span></h1>

          <div class="biorow">
            <div class="pf pf--window">
              <div class="pf__inner">
                <div class="pf__bar"><span class="pf__name">Rod</span></div>
                <div class="pf__body">
                  <div class="pf__media" data-placeholder="true">
                    <span class="favicon favicon--square">
                      <img class="favicon__img" src="{{ '/assets/img/favicons/favicon.svg' | relative_url }}" alt="" width="26" height="26">
                    </span>
                  </div>
                </div>
              </div>
            </div>

            <div class="biocol">
              <h2 class="bio-h">Hey There, I'm <span class="boil-word">Rod</span></h2>
              {{ page.bio_intro | markdownify }}
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="band band--tight">
      <div class="textbox">
        <h3 class="bio-h bio-h--lesser">More About Me</h3>
        {{ page.bio_more | markdownify }}
      </div>
    </section>

    <section class="band">
      <h2 class="section-head"><span class="section-head__name">Achievements</span></h2>
      <div class="tagline">yours, not mine</div>
      <div class="sect">
        <div class="aw">
          <div class="aw__cat"></div>
          <div class="aw__detail"></div>
        </div>
      </div>
    </section>

    {{ content }}
  </div>

  <div class="scenewide" aria-hidden="true"><div class="scenewide__hole"></div></div>
</div>
