---
layout: default
---

<div class="under-construction">
  <div class="construction-icon">&#x1F3EE;</div>

  <div class="page-heading page-heading--sub">
    <h1 class="page-heading__title heading-1-display" id="construction-title">{{ page.title | default: 'Under Construction' }}</h1>
    <p class="page-heading__desc">This project is still being crafted. Like a lantern waiting for its flame, check back soon!</p>
  </div>

  <a id="back-link" class="kit-button kit-button--pill orb-fill magnet"
     href="{{ '/tech-art/projects/' | relative_url }}">
    <span class="kit-button__label magnet-inner">Back to projects</span>
  </a>

  <div id="recommendations" class="recommendations" hidden>
    <p class="recommendations-title">Pages you might like</p>
    <div id="recommendations-list" class="rc-grid"></div>
  </div>
</div>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var pathParts = window.location.pathname.split('/').filter(Boolean);
    var section = pathParts.length > 1 ? pathParts[0] : null;
    var title = params.get('title');
    var tags = params.get('tags');
    var link = document.getElementById('back-link');

    if (section && link) {
      link.href = '/' + section + '/projects/';
    }

    if (title) {
      document.getElementById('construction-title').textContent = title;
    }

    function addCard(container, rec, related) {
      var a = document.createElement('a');
      a.href = rec.url;
      a.className = 'rc rc--v1';
      var body = document.createElement('div');
      body.className = 'rc__body';
      var ttl = document.createElement('div');
      ttl.className = 'rc__title';
      ttl.textContent = rec.title;
      var meta = document.createElement('div');
      meta.className = 'rc__meta';
      meta.textContent = related ? 'Related project' : 'Explore';
      body.appendChild(ttl);
      body.appendChild(meta);
      a.appendChild(body);
      container.appendChild(a);
    }

    function show(top, related) {
      if (top.length === 0) return;
      var container = document.getElementById('recommendations-list');
      top.forEach(function(rec) { addCard(container, rec, related); });
      document.getElementById('recommendations').hidden = false;
    }

    if (tags && section) {
      var tagList = tags.split(',').map(function(t) { return t.trim().toLowerCase(); }).filter(Boolean);

      var allPosts = [
        {% for post in site.posts %}{% unless post.wip %}
        { "title": {{ post.title | jsonify }}, "url": {{ post.url | jsonify }}, "section": {{ post.section | jsonify }}, "tags": {{ post.tags | jsonify }} },
        {% endunless %}{% endfor %}
      ];

      var scored = [];
      allPosts.forEach(function(post) {
        if (!post.section || post.section !== section) return;
        var postTags = (post.tags || []).map(function(t) { return t.toLowerCase(); });
        var shared = tagList.filter(function(t) { return postTags.indexOf(t) !== -1; });
        if (shared.length > 0) {
          scored.push({ title: post.title, url: post.url, score: shared.length });
        }
      });

      scored.sort(function(a, b) { return b.score - a.score; });
      var top = scored.slice(0, 3);

      if (top.length === 0) {
        var sectionPosts = allPosts.filter(function(p) { return p.section === section; });
        top = sectionPosts.slice(0, 3).map(function(p) { return { title: p.title, url: p.url, score: 0 }; });
      }

      show(top, top.length > 0 && top[0].score > 0);
    }

    if (!tags && section) {
      var recentPosts = [
        {% for post in site.posts %}{% unless post.wip %}
        { "title": {{ post.title | jsonify }}, "url": {{ post.url | jsonify }}, "section": {{ post.section | jsonify }}, "tags": {{ post.tags | jsonify }} },
        {% endunless %}{% endfor %}
      ];
      show(recentPosts.filter(function(p) { return p.section === section; }).slice(0, 3), false);
    }
  })();
</script>
