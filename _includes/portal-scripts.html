<script type="module" src="{{ '/assets/js/effects/portal-windows.js' | relative_url }}"></script>

<script>
  (function () {
    var REPEATS = 40;
    document.querySelectorAll('.pwin').forEach(function (win) {
      var title = win.querySelector('.pwin__title');
      var fill = win.querySelector('.pwin__fill');
      if (!title || !fill) return;
      var word = title.textContent.trim();
      fill.textContent = new Array(REPEATS).fill(word).join(' ');
    });
  })();
</script>

<script type="module">
  import { initLineBoil } from '{{ '/assets/js/components/line-boil.js' | relative_url }}';
  initLineBoil(document.querySelector('.centre__mark'));
</script>
