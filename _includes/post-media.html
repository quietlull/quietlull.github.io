{%- assign _ext = include.src | split: '.' | last | downcase -%}
{%- if _ext == 'mp4' or _ext == 'webm' -%}
<video src="{{ include.src | relative_url }}"{% if include.class %} class="{{ include.class }}"{% endif %} aria-label="{{ include.alt }}" autoplay muted loop playsinline></video>
{%- else -%}
<img src="{{ include.src | relative_url }}"{% if include.class %} class="{{ include.class }}"{% endif %} alt="{{ include.alt }}" loading="lazy">
{%- endif -%}
