{%- assign _ext = include.src | split: '.' | last | downcase -%}
{%- if _ext == 'mp4' or _ext == 'webm' -%}
<video src="{{ include.src | relative_url }}"{% if include.class %} class="{{ include.class }}"{% endif %} aria-label="{{ include.alt }}" autoplay muted loop playsinline{% if include.width %} width="{{ include.width }}" height="{{ include.height }}"{% endif %}></video>
{%- else -%}
<img src="{{ include.src | relative_url }}"{% if include.class %} class="{{ include.class }}"{% endif %} alt="{{ include.alt }}"{% if include.width %} width="{{ include.width }}" height="{{ include.height }}"{% endif %}{% if include.lqip %} lqip="{{ include.lqip }}"{% endif %} loading="lazy">
{%- endif -%}
