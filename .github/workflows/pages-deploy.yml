name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true
      
      - name: npm build
        run: npm install && npm run build
      
      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # THE WORKBENCH NEVER SHIPS. Rod, decision D49: keep the lab and put it in version control,
      # "provided its much cleaner and cant be accessed and wont be built on the main site when it
      # ships." It is removed HERE, after the build and before the test and upload, rather than
      # via the config exclude list, and that is deliberate for two reasons.
      # First, excluding it would also stop it building LOCALLY, and Rod works from the lab's own
      # pages at localhost every day, todo.html most of all. This keeps local exactly as it is.
      # Second, Jekyll config merging REPLACES arrays rather than appending to them, so adding the
      # lab through a second production config would silently drop every other exclusion (docs,
      # tools, CLAUDE.md) and publish them. One line here has no such trap.
      # htmlproofer runs AFTER this on purpose: the lab's pages link to bench files and reference
      # screenshots that are not part of the site, and checking them would fail the deploy.
      - name: Remove the redesign lab from the built site
        run: rm -rf "_site${{ steps.pages.outputs.base_path }}/redesign-lab"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
